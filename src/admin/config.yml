backend:
  name: github
  repo: techtravel2x/AltairGrowth
  branch: main

# Where uploaded images (FAQ icons, blog thumbnails) get stored,
# and the path the live site will reference them at.
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

# Optional but recommended: require a review step before anything
# goes live, instead of publishing straight to the main branch.
publish_mode: editorial_workflow

site_url: https://altarisgrowth.com
display_url: https://altarisgrowth.com

collections:
  # ---------------------------------------------------------------
  # FAQ — powers faq.html. Each entry is one question/answer pair.
  # ---------------------------------------------------------------
  - name: "faq"
    label: "FAQ"
    label_singular: "FAQ Entry"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.question}}"
    sortable_fields: ["order", "question"]
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "markdown" }
      - label: "Display Order"
        name: "order"
        widget: "number"
        hint: "Lower numbers appear first on the FAQ page."
        default: 10
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true

  # ---------------------------------------------------------------
  # Insights — powers insights.html plus one page per article.
  # ---------------------------------------------------------------
  - name: "insights"
    label: "Insights"
    label_singular: "Insight"
    folder: "src/content/insights"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Enterprise Value", "Leadership", "Operations", "Growth Strategy"]
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Read Time (minutes)"
        name: "read_time"
        widget: "number"
        default: 4
      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "1-2 sentences shown on the Insights list page."
      - label: "Cover Image"
        name: "thumbnail"
        widget: "image"
        required: false
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured posts can be pinned to the top of the Insights page."

  # ---------------------------------------------------------------
  # Join Us — optional: lets the business add/remove open roles
  # without a developer, same pattern as FAQ/Insights.
  # ---------------------------------------------------------------
  - name: "roles"
    label: "Open Roles"
    label_singular: "Role"
    folder: "src/content/roles"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { label: "Role Title", name: "title", widget: "string" }
      - label: "Location"
        name: "location"
        widget: "string"
        hint: "e.g. Remote · Canada, or Hybrid · Toronto"
      - label: "Employment Type"
        name: "employment_type"
        widget: "select"
        options: ["Full-time", "Part-time", "Contract"]
        default: "Full-time"
      - { label: "Description", name: "description", widget: "markdown" }
      - label: "Open"
        name: "open"
        widget: "boolean"
        default: true
        hint: "Turn off instead of deleting once a role is filled."
