backend:
  name: github
  repo: techtravel2x/AltairGrowth
  branch: main

# Where uploaded images (FAQ icons, blog thumbnails) get stored,
# and the path the live site will reference them at.
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

# Optional but recommended: require a review step before anything
# goes live, instead of publishing straight to the main branch.

site_url: https://altarisgrowth.com
display_url: https://altarisgrowth.com

collections:
  # ---------------------------------------------------------------
  # FAQ — powers faq.html. Each entry is one question/answer pair.
  # ---------------------------------------------------------------
  - name: "faq"
    label: "FAQ"
    label_singular: "FAQ Entry"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.question}}"
    sortable_fields: ["order", "question"]
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "markdown" }
      - label: "Display Order"
        name: "order"
        widget: "number"
        hint: "Lower numbers appear first on the FAQ page."
        default: 10
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true

  # ---------------------------------------------------------------
  # Insights — powers insights.html plus one page per article.
  # ---------------------------------------------------------------
  - name: "insights"
    label: "Insights"
    label_singular: "Insight"
    folder: "src/content/insights"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Enterprise Value", "Leadership", "Operations", "Growth Strategy"]
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Read Time (minutes)"
        name: "read_time"
        widget: "number"
        default: 4
      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "1-2 sentences shown on the Insights list page."
      - label: "Cover Image"
        name: "thumbnail"
        widget: "image"
        required: false
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured posts can be pinned to the top of the Insights page."

  # ---------------------------------------------------------------
  # Join Us — optional: lets the business add/remove open roles
  # without a developer, same pattern as FAQ/Insights.
  # ---------------------------------------------------------------
  - name: "roles"
    label: "Open Roles"
    label_singular: "Role"
    folder: "src/content/roles"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { label: "Role Title", name: "title", widget: "string" }
      - label: "Location"
        name: "location"
        widget: "string"
        hint: "e.g. Remote · Canada, or Hybrid · Toronto"
      - label: "Employment Type"
        name: "employment_type"
        widget: "select"
        options: ["Full-time", "Part-time", "Contract"]
        default: "Full-time"
      - { label: "Description", name: "description", widget: "markdown" }
      - label: "Open"
        name: "open"
        widget: "boolean"
        default: true
        hint: "Turn off instead of deleting once a role is filled."

  # ---------------------------------------------------------------
  # Page Content — headlines, intros, and CTA text for each page.
  # This is a "file collection": a fixed set of single files, one
  # per page, rather than an open-ended list like FAQ/Insights.
  # ---------------------------------------------------------------
  - name: "pages"
    label: "Page Content"
    files:
      - file: "src/_data/pages/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Eyebrow (small label above headline)", name: "eyebrow", widget: "string" }
          - { label: "Tagline (italic line under eyebrow)", name: "tagline", widget: "string" }
          - { label: "Headline — main part", name: "headline_main", widget: "string" }
          - { label: "Headline — highlighted part (shown in gold italics)", name: "headline_highlight", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }
          - { label: "Primary button text", name: "primary_cta_label", widget: "string" }
          - { label: "Secondary link text", name: "secondary_cta_label", widget: "string" }

      - file: "src/_data/pages/growth-strategies.json"
        label: "Growth Strategies Page"
        name: "growth-strategies"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "h1", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }

      - file: "src/_data/pages/how-it-works.json"
        label: "How It Works Page"
        name: "how-it-works"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "h1", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }

      - file: "src/_data/pages/resources.json"
        label: "Resources Page"
        name: "resources"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "h1", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }

      - file: "src/_data/pages/industries.json"
        label: "Industries Page"
        name: "industries"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "h1", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }

      - file: "src/_data/pages/faq.json"
        label: "FAQ Page"
        name: "faq"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "h1", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }

      - file: "src/_data/pages/insights.json"
        label: "Insights Page"
        name: "insights"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "h1", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }

      - file: "src/_data/pages/join-us.json"
        label: "Join Us Page"
        name: "join-us"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "h1", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }

      - file: "src/_data/pages/contact.json"
        label: "Contact Page"
        name: "contact"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "h1", widget: "string" }
          - { label: "Intro paragraph", name: "lede", widget: "text" }
          - { label: "Reply block eyebrow", name: "reply_eyebrow", widget: "string" }
          - { label: "Reply block heading", name: "reply_heading", widget: "string" }
          - { label: "Reply block note", name: "reply_note", widget: "text" }

      - file: "src/_data/contactInfo.json"
        label: "Contact Info (used in footer/contact page)"
        name: "contact-info"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
